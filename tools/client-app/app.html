}[LANG];
const MOIS = LANG === 'fr' ? ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] : ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = LANG === 'fr' ? ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PLAT = {ig:'Instagram', fb:'Facebook', li:'LinkedIn', tt:'TikTok'}, PLATS = {ig:'IG', fb:'FB', li:'in', tt:'TT'};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const store = { get(k, d) { try { const v = localStorage.getItem('pbv:' + CFG.client_id + ':' + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('pbv:' + CFG.client_id + ':' + k, v); } catch (e) {} } };
const isMob = () => window.matchMedia('(max-width:760px)').matches;
const OKSVG = '<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2.2"><path d="M2 5.2l2 2L8 3"/></svg>';
const PLAYSVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
const ICON = {
  car: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>',
  reel: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>',
  ig: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>',

  fb: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.2C16.6 2.1 15.5 2 14.3 2 11.6 2 10 3.6 10 6.5v2H7V12h3v10h4V12h2.8l.4-3.5z"/></svg>',
  tt: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.4 1.9 3.9 4.5 4.1v3.2c-1.6.1-3-.4-4.4-1.3v6.1c0 3.6-2.6 5.9-5.8 5.9A5.6 5.6 0 0 1 5.2 15.4c0-3.6 3-6 6.5-5.5v3.3c-1.6-.4-3.2.6-3.2 2.2 0 1.3 1 2.3 2.4 2.3 1.5 0 2.4-1 2.4-2.6V3z"/></svg>'
};

/* ---------- state and data ---------- */
let months = [], items = [], valMonth = '', valView = store.get('view', 'cal'), fSt = '', fPl = '', appTab = 'ig', appSheet = null, appStory = null, current = 'accueil';
const byId = id => items.find(c => c.id === id);
const ST = { prod: TXT.prod, review: TXT.review, changes: TXT.changes, ok: TXT.ok, live: TXT.live };
const STL = { review: TXT.review, changes: TXT.changes, ok: TXT.okp, prod: TXT.prod, live: TXT.live };
const CHG = { copy: TXT.chg_copy, visual: TXT.chg_visual, both: TXT.chg_both };
const capOf = c => c.opts ? c.opts[c.pick ?? 0] : (c.cap || '');
const todo = c => c.st === 'review' || c.st === 'changes';
const dLabel = iso => { const [y, m, d] = iso.split('-'); return LANG === 'fr' ? `${+d} ${MOIS[+m - 1]} ${y}` : `${+d} ${MOIS[+m - 1]} ${y}`; };
const shortD = iso => dLabel(iso).replace(/ \d{4}$/, '');
const tm = t => !t ? '' : LANG === 'fr' ? t.replace(':', 'h') : (() => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; })();

async function api(params) {
  if (PREVIEW) return params.action === 'months' ? { months: PREVIEW.months } : PREVIEW.data[params.key];
  const q = new URLSearchParams(Object.assign({ client: CFG.client_id, token: CFG.token }, params));
  const r = await fetch(CFG.endpoint + '?' + q.toString()); const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
async function decide(c, body) {
  if (PREVIEW) return { ok: true, preview: true };
  const r = await fetch(CFG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ client: CFG.client_id, token: CFG.token, tab: c.tab, cols: c.cols, title: c.title, dateLabel: c.dateLabel, who: $('#who').value }, body)) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- media: real photos and videos from the day folders ---------- */
const vis = c => c.visuals || [];
const src0 = c => (vis(c)[0] || {}).src || '';
const img = (src, cls = '') => src ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy">` : `<div class="noimg">${TXT.vis_soon}</div>`;
function videoBox(v, cls = '') { return `<div class="vwrap ${cls}" data-video="${esc(v.embed)}">${img(v.src)}<span class="vbadge">▶ Video</span><button class="vplay" aria-label="${TXT.play}">${PLAYSVG}</button></div>`; }
function slideHTML(v) { return v.kind === 'video' && v.embed ? videoBox(v) : img(v.src); }
function reelHTML(c) { const v = vis(c).find(x => x.kind === 'video') || vis(c)[0];
  return `<div class="reel x-${c.st}" style="position:relative">${v ? slideHTML(v) : img('')}${c.scr && c.scr.length ? `<div class="rtxt">${esc(c.scr[0])}</div>` : ''}</div>`; }
function storyMediaHTML(c, k = 0) { const fr = c.frames && c.frames.length ? c.frames : [c.t]; const V = vis(c); const v = V[Math.min(k, V.length - 1)];
  return `<div class="smedia x-${c.st}" data-story-media="${c.id}" data-k="${k}">${v ? slideHTML(v) : img('')}<div class="bars">${fr.map((_, j) => `<i class="${j <= k ? 'cur' : ''}"></i>`).join('')}</div><div class="ov">${c.st === 'prod' ? TXT.prod : esc(fr[k] || '')}</div>${fr.length > 1 ? `<div class="nav2"><button data-sm="-1" aria-label="‹">‹</button><button data-sm="1" aria-label="›">›</button></div>` : ''}</div>`; }
function carHTML(c, dotsBelow = true) { const S = vis(c).length ? vis(c) : [{ src: '' }];
  return `<div class="car x-${c.st}" data-car><div class="car-track">${S.map(v => `<div style="flex:0 0 100%;scroll-snap-align:start;position:relative">${slideHTML(v)}</div>`).join('')}</div><span class="car-n">1/${S.length}</span><button class="car-btn pv" data-cv="-1" aria-label="‹" disabled>‹</button><button class="car-btn nx" data-cv="1" aria-label="›" ${S.length < 2 ? 'disabled' : ''}>›</button>${dotsBelow ? `<div class="car-dots">${S.map((_, j) => `<i class="${j ? '' : 'on'}"></i>`).join('')}</div>` : ''}</div>`; }
function mediaHTML(c) { return c.kind === 'story' ? storyMediaHTML(c) : c.fmt === 'Reel' ? reelHTML(c) : vis(c).length > 1 ? carHTML(c) : `<div class="mfeed x-${c.st}" style="position:relative">${vis(c)[0] ? slideHTML(vis(c)[0]) : img('')}</div>`; }
const feedMedia = mediaHTML;
function bindMedia(root) {
  root.querySelectorAll('[data-video] .vplay').forEach(b => b.onclick = e => { e.stopPropagation(); const w = b.closest('[data-video]');
    const u = w.dataset.video;
    w.innerHTML = /\.(mp4|mov|webm)(\?|$)/i.test(u) ? `<video src="${esc(u)}" controls autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain"></video>`
      : `<iframe src="${esc(u)}" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe>`; });
  root.querySelectorAll('[data-car]').forEach(car => { const tr = car.querySelector('.car-track'); const n = tr.children.length;
    const upd = () => { const i = Math.round(tr.scrollLeft / Math.max(tr.clientWidth, 1)); car.querySelector('.car-n').textContent = `${i + 1}/${n}`; car.querySelectorAll('.car-dots i').forEach((d, j) => d.classList.toggle('on', j === i)); car.querySelector('.pv').disabled = i === 0; car.querySelector('.nx').disabled = i === n - 1; };
    tr.onscroll = () => { cancelAnimationFrame(tr._r); tr._r = requestAnimationFrame(upd); };
    car.querySelectorAll('[data-cv]').forEach(b => b.onclick = e => { e.stopPropagation(); tr.scrollBy({ left: +b.dataset.cv * tr.clientWidth, behavior: 'smooth' }); }); });
  root.querySelectorAll('[data-story-media] [data-sm]').forEach(b => b.onclick = e => { e.stopPropagation(); const box = b.closest('[data-story-media]'); const c = byId(box.dataset.storyMedia); const n = (c.frames && c.frames.length ? c.frames : [c.t]).length; const k = Math.max(0, Math.min(n - 1, +box.dataset.k + +b.dataset.sm));
    const tmp = document.createElement('div'); tmp.innerHTML = storyMediaHTML(c, k); box.replaceWith(tmp.firstChild); bindMedia(root); });
}

/* ---------- review block, shared by the desktop sheet and the phone app ---------- */
const ppills = c => c.plats.map(p => `<span class="pp ${p}" title="${PLAT[p]}">${PLATS[p]}</span>`).join('') + `<span class="pk ${c.kind}">${c.kind === 'story' ? TXT.story : c.fmt === 'Reel' ? TXT.reel : TXT.feed}</span>`;
const stLabel = c => c.st === 'changes' && c.change ? CHG[c.change] : ST[c.st];
const chip = c => `<span class="chipst x-${c.st}"><span class="sd x-${c.st}"></span>${stLabel(c)}</span>`;
function copyBlock(c, ctx) {
  if (c.kind === 'story' || c.st === 'prod' || !c.opts) return '';
  if (!todo(c)) return `<div class="copts"><div class="cap2">${TXT.kept}</div><div class="copt on locked"><span></span><span>${nl(capOf(c))}</span></div></div>`;
  if (c.opts.length === 1) return `<div class="copts"><div class="cap2">${TXT.kept}</div><div class="copt on locked"><span></span><span>${nl(c.opts[0])}</span></div></div>`;
  return `<div class="copts"><div class="cap2">${TXT.choose}</div>${c.opts.map((o, i) => `<label class="copt ${c.pick === i ? 'on' : ''}"><input type="radio" name="cp-${ctx}-${c.id}" data-cid="${c.id}" data-pick="${i}" ${c.pick === i ? 'checked' : ''}><span><b>${TXT.option} ${'ABCDE'[i]}</b>${nl(o)}</span></label>`).join('')}</div>`;
}
function extraBlock(c) {
  let h = '';
  if (c.scr && c.scr.length) h += `<div class="extra2"><b>${TXT.onscreen.toUpperCase()}</b>${nl(c.scr.join('\n'))}</div>`;
  if (c.slides && c.slides.length) h += `<div class="extra2"><b>${TXT.slides.toUpperCase()}</b>${c.slides.map((s, i) => `${i + 1}. ${esc(s)}`).join('<br>')}</div>`;
  if (c.notes && c.notes.length && c.st !== 'prod') h += `<div class="extra2">${nl(c.notes.join('\n'))}</div>`;
  if (c.tags && c.st !== 'prod') h += `<div class="extra2 tags">${esc(c.tags)}</div>`;
  return h;
}
function reviewBlock(c, ctx) {
  let h = `<div class="row2">${ppills(c)}${chip(c)}</div>`;
  h += `<div class="note2">${dLabel(c.d)}${c.time ? ` ${TXT.at} ${tm(c.time)}` : ''} · ${c.fmt}${c.pil ? ' · ' + esc(c.pil) : ''}</div>`;
  (c.comments || []).forEach(x => { h += `<div class="cm"><b>${esc(x.who)} · ${esc(x.when)}</b>${esc(x.text || CHG[x.change] || '')}</div>`; });

  $('#fSt').innerHTML = `<option value="">${TXT.all_st}</option>` + ['review', 'changes', 'ok', 'prod', 'live'].map(k => `<option value="${k}">${STL[k]}</option>`).join('');
  $('#fPl').innerHTML = `<option value="">${TXT.all_pl}</option><option value="igf">${TXT.igf}</option><option value="igs">${TXT.igs}</option>` + (CFG.platforms || []).filter(p => p !== 'ig').map(p => `<option value="${p}">${PLAT[p]}</option>`).join('');
  $('#fSt').onchange = e => { fSt = e.target.value; renderVal(); }; $('#fPl').onchange = e => { fPl = e.target.value; renderVal(); };
  $$('#valView button').forEach(b => b.onclick = () => { valView = b.dataset.v; store.set('view', valView); renderVal(); });
  $('#mDropBtn').onclick = e => { e.stopPropagation(); $('#mDropMenu').hidden = !$('#mDropMenu').hidden; };
  $('#mDropMenu').onclick = e => { const b = e.target.closest('button[data-m]'); if (b) { $('#mDropMenu').hidden = true; loadMonth(b.dataset.m); } };
  document.addEventListener('click', e => { const m = $('#mDropMenu'); if (m && !m.hidden && !e.target.closest('#mDrop')) m.hidden = true; });
  $('#mClose').onclick = () => $('#modal').classList.remove('open');
  $('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').classList.remove('open'); });
  $('#logout').onclick = () => { try { sessionStorage.removeItem(CFG.session_key); } catch (x) {} location.reload(); };
}
function renderHomeCount() { const n = items.filter(c => c.st === 'review').length, e = $('#homeCount'); if (e) { e.textContent = n; e.hidden = !n; } }
const VIEWS = ['accueil', 'dashboard', 'documents', 'validation'];
function route() {
  $('#modal').classList.remove('open');
  const v = (location.hash || '#accueil').slice(1); current = VIEWS.includes(v) && (v !== 'dashboard' || CFG.dashboard) && (v !== 'validation' || CFG.calendar) ? v : 'accueil';
  VIEWS.forEach(x => $('#v-' + x).classList.toggle('on', x === current));
  $$('#hnav a').forEach(a => a.classList.toggle('on', a.dataset.g === current));
  if (current === 'dashboard' && !$('#dashHost iframe')) $('#dashHost').innerHTML = `<iframe class="dash-frame" src="${esc(CFG.dashboard)}" title="${TXT.nav_dash}" scrolling="no"></iframe>`;
  if (current === 'validation') renderVal();
  window.scrollTo(0, 0);
}
async function loadMonth(key) {
  valMonth = key; appSheet = null; appStory = null;
  const m = months.find(x => x.key === key);
  try { items = (await api({ action: 'month', tab: m.tab, key })).items || []; } catch (e) { items = []; toast(TXT.load_err); }
  items.forEach(c => { if (c.pick === undefined) c.pick = null; });
  renderHomeCount(); if (current === 'validation') renderVal();
}
let lastMob = isMob(); window.addEventListener('resize', () => { const m = isMob(); if (m !== lastMob) { lastMob = m; if (current === 'validation') renderVal(); } });
window.addEventListener('hashchange', route);
// The dashboard page reports its height so the frame grows with it (one scroll for the whole page)
window.addEventListener('message', e => { const f = $('#dashHost iframe'); if (f && e.source === f.contentWindow && e.data && e.data.pbvDashHeight) f.style.height = Math.max(400, +e.data.pbvDashHeight) + 'px'; });
async function start() {
  renderStatic(); route();
  if (!CFG.calendar) return;
  try {
    months = (await api({ action: 'months' })).months || [];
    const nowKey = curKey(), next = months.filter(m => m.key >= nowKey);
    // The month being reviewed: the next one once the current one is mostly done, else the current one
    const pick = (next[1] && new Date().getDate() >= 15 ? next[1] : next[0] || months[months.length - 1]);
    if (pick) await loadMonth(pick.key);
  } catch (e) { toast(TXT.load_err); }
}
start();
}
</script>
</body>
