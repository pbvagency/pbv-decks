# proposals.pbvagency.com: one folder per deck, e.g. proposals/<deck-name>/index.html
# No build step: Netlify publishes this folder as it is.
[build]
  publish = "."

# Decks must never appear in Google, whatever the file itself says.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
